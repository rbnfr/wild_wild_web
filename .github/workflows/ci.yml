name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Lint, tipos, tests y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Formato
        run: npm run format:check

      - name: Tipos
        run: npm run typecheck

      - name: Tests unitarios
        run: npm test

      - name: Build de producción
        run: npm run build

      # Solo dependencias de producción: lo que se despliega. Ver README (sección Seguridad)
      # sobre la advertencia conocida de "braces" en las herramientas de desarrollo.
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high

  e2e:
    name: Tests E2E (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias (reproducible)
        run: npm ci

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # La configuración de Playwright construye y arranca la aplicación en modo producción
      # con el envío de correo en dry-run: no se envía ningún correo real.
      - name: Ejecutar E2E y comprobaciones de accesibilidad
        run: npx playwright test

      - name: Subir informe de Playwright
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
