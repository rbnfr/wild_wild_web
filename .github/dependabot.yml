# Weekly, grouped dependency updates opened against the editable branch.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: static-version
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Madrid
    open-pull-requests-limit: 5
    groups:
      framework:
        patterns: ["next", "react", "react-dom", "@types/react*"]
      tooling:
        dependency-type: development
        update-types: ["minor", "patch"]
  - package-ecosystem: github-actions
    directory: /
    target-branch: static-version
    schedule:
      interval: monthly
